name: Build Saturn Client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Prüft, dass die Quelldateien zusammenpassen (die Grossgeschriebenen
      # Modul-/Screen-Namen müssen exakt so im Dateisystem stehen).
      - name: Java-Dateinamen gegen Klassen abgleichen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fehler = @()
          Get-ChildItem -Recurse -Filter *.java | ForEach-Object {
            $name = $_.BaseName
            $inhalt = Get-Content $_.FullName -Raw
            if ($inhalt -notmatch "(class|interface|enum)\s+$name\b") {
              $fehler += "$name  ($($_.FullName))"
            }
          }
          if ($fehler.Count) {
            Write-Error ("Dateiname passt nicht zur Klasse: " + ($fehler -join ', '))
          }
          Write-Host "Alle Java-Dateien passen zu ihren Klassen."

      # Gradle laeuft hier auf Java 25, weil das aktuelle Fabric-Loom das beim
      # Start verlangt. Gebaut werden aber weiterhin Java-21-Klassen, weil
      # Minecraft 1.21.x Java 21 braucht.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      # resources/saturn-<version>.jar ist bewusst nicht im Repo (siehe
      # .gitignore) und wird hier frisch erzeugt - eine Jar je Minecraft-
      # Version, weil Yarn zwischen den Versionen umbenennt.
      - name: Mod fuer alle Versionen bauen
        shell: cmd
        run: buildmod.bat

      - name: Ergebnis anzeigen
        shell: pwsh
        run: |
          Write-Host '--- Mod-Jars ---'
          Get-ChildItem resources/saturn-*.jar | Select-Object Name, Length
          $anzahl = @(Get-ChildItem resources/saturn-*.jar).Count
          if ($anzahl -eq 0) {
            throw 'Keine Mod gebaut - resources\saturn-*.jar ist leer'
          }
          Write-Host "$anzahl Minecraft-Version(en) mit Mod"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Ergebnis anzeigen
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length
          if (-not @(Get-ChildItem resources/saturn-*.jar).Count) {
            throw 'Mod fehlt im Setup - resources/saturn-*.jar wurde nicht erzeugt'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Saturn-Client-Setup
          path: dist/*.exe
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap