<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Weltraum: dunkler Rotbraun-Verlauf -->
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%"   stop-color="#3a1a0c"/>
      <stop offset="45%"  stop-color="#1c0b06"/>
      <stop offset="100%" stop-color="#070303"/>
    </radialGradient>

    <!-- Planetenkugel: nur ein schwarzer Ball mit schmalem Lichtsaum -->
    <radialGradient id="planet" cx="34%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#0a0503"/>
      <stop offset="72%"  stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="rim" cx="72%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="35%"  stop-color="#b46a12" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ringe: warmes Bernstein -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5a2c05"/>
      <stop offset="28%"  stop-color="#d4861a"/>
      <stop offset="52%"  stop-color="#ffcf6a"/>
      <stop offset="74%"  stop-color="#e08b12"/>
      <stop offset="100%" stop-color="#4a2204"/>
    </linearGradient>

    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffdf2" stop-opacity="1"/>
      <stop offset="22%"  stop-color="#ffd97a" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#e08b12" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e08b12" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="ball"><circle cx="700" cy="470" r="215"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>

  <!-- Sternfeld -->
  <g fill="#ffd9a8">
    <g opacity="0.75">
      <circle cx="120"  cy="90"  r="1.6"/><circle cx="330" cy="180" r="1.2"/><circle cx="480" cy="60"  r="1.8"/>
      <circle cx="700" cy="140" r="1.1"/><circle cx="900" cy="80"  r="1.5"/><circle cx="1080" cy="200" r="1.3"/>
      <circle cx="1290" cy="110" r="1.7"/><circle cx="1470" cy="240" r="1.2"/><circle cx="80"  cy="330" r="1.4"/>
      <circle cx="250" cy="420" r="1.1"/><circle cx="1520" cy="420" r="1.5"/><circle cx="1380" cy="90" r="1.2"/>
      <circle cx="1180" cy="420" r="1.3"/><circle cx="1420" cy="600" r="1.6"/><circle cx="1560" cy="700" r="1.1"/>
      <circle cx="60"  cy="640" r="1.7"/><circle cx="180" cy="780" r="1.2"/><circle cx="360" cy="820" r="1.5"/>
      <circle cx="520" cy="760" r="1.1"/><circle cx="980" cy="840" r="1.4"/><circle cx="1200" cy="780" r="1.2"/>
      <circle cx="760"  cy="800" r="1.3"/><circle cx="1340" cy="520" r="1.2"/><circle cx="60"  cy="180" r="1.2"/>
      <circle cx="1560" cy="180" r="1.3"/><circle cx="900" cy="640" r="1.1"/><circle cx="420" cy="300" r="1.4"/>
    </g>
    <g opacity="0.35">
      <circle cx="200" cy="220" r="1"/><circle cx="640" cy="380" r="1"/><circle cx="1120" cy="300" r="1"/>
      <circle cx="1300" cy="700" r="1"/><circle cx="460" cy="620" r="1"/><circle cx="820" cy="560" r="1"/>
      <circle cx="1000" cy="60"  r="1"/><circle cx="240" cy="560" r="1"/><circle cx="1500" cy="520" r="1"/>
    </g>
  </g>

  <!-- hintere Ringhälfte (hinter dem Planeten) -->
  <g opacity="0.55" transform="rotate(-14 700 470)">
    <ellipse cx="700" cy="470" rx="620" ry="132" fill="none" stroke="url(#ring)" stroke-width="26" filter="url(#soft)"/>
  </g>

  <!-- Planet -->
  <circle cx="700" cy="470" r="215" fill="url(#planet)"/>

  <!-- schmale beleuchtete Kante rechts -->
  <circle cx="700" cy="470" r="215" fill="url(#rim)" clip-path="url(#ball)"/>

  <!-- vordere Ringhälfte -->
  <g transform="rotate(-14 700 470)">
    <ellipse cx="700" cy="470" rx="620" ry="132" fill="none" stroke="url(#ring)" stroke-width="30"/>
    <ellipse cx="700" cy="470" rx="620" ry="132" fill="none" stroke="#ffe6a8" stroke-width="7" opacity="0.45" filter="url(#soft)"/>
    <!-- dunkle Ringlücken -->
    <ellipse cx="700" cy="470" rx="712" ry="150" fill="none" stroke="#0b0402" stroke-width="9" opacity="0.75"/>
    <ellipse cx="700" cy="470" rx="520" ry="112" fill="none" stroke="#120803" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- Sonnenglanz, der die Ringe durchschneidet -->
  <g>
    <circle cx="1010" cy="392" r="190" fill="url(#flare)"/>
    <circle cx="1010" cy="392" r="46"  fill="#fff8e2" opacity="0.95" filter="url(#softer)"/>
    <circle cx="1010" cy="392" r="16"  fill="#ffffff"/>
    <!-- Strahlen -->
    <g stroke="#ffd27a" stroke-linecap="round" opacity="0.5">
      <line x1="1010" y1="392" x2="1010" y2="60"  stroke-width="4"/>
      <line x1="1010" y1="392" x2="1010" y2="880" stroke-width="4"/>
      <line x1="1010" y1="392" x2="600"  y2="392" stroke-width="4"/>
      <line x1="1010" y1="392" x2="1560" y2="392" stroke-width="4"/>
      <line x1="1010" y1="392" x2="700"  y2="120" stroke-width="2.5"/>
      <line x1="1010" y1="392" x2="1420" y2="760" stroke-width="2.5"/>
    </g>
  </g>
</svg>